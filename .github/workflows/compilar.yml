name: Compilar apps (Windows y macOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publicar (ej. 1.1.0). Vacio = solo compilar"
        required: false
        default: ""

env:
  # Version a publicar: la del tag vX.Y.Z o la escrita al ejecutar el workflow a mano.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: Compresorfree-Windows
          - os: macos-latest          # Apple Silicon (M1/M2/M3...)
            nombre: Compresorfree-macOS-AppleSilicon
          - os: macos-15-intel        # Mac con procesador Intel
            nombre: Compresorfree-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Poner la version (v1.2.3 -> 1.2.3)
        if: env.VERSION != ''
        shell: bash
        run: echo "VERSION = \"${VERSION#v}\"" > version.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Solo ruedas precompiladas: en Mac Intel la ultima version de pikepdf no tiene
          # rueda y se intentaria compilar desde codigo fuente (falla).
          pip install --only-binary=pikepdf,Pillow -r requirements.txt -r requirements-build.txt

      - name: Compilar
        run: python compilar.py

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Compresorfree -DestinationPath ${{ matrix.nombre }}.zip

      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname Compresorfree -srcfolder dist/Compresorfree.app \
            -ov -format UDZO ${{ matrix.nombre }}.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nombre }}
          path: |
            ${{ matrix.nombre }}.zip
            ${{ matrix.nombre }}.dmg
          if-no-files-found: error

  publicar:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: descargas
          merge-multiple: true
      - name: Normalizar tag
        run: echo "TAG=v${VERSION#v}" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Compresorfree ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: descargas/*
          generate_release_notes: true
