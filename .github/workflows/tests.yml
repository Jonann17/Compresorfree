name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install ruff
          ruff check --select F,E9 .

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=pikepdf,Pillow -r requirements.txt -r requirements-dev.txt

      - name: Sistema de archivos del runner
        shell: python
        run: |
          import os, platform, tempfile
          print(platform.platform(), "| temp:", tempfile.gettempdir(), "| cwd:", os.getcwd())

      - name: Instalar xvfb (pantalla virtual para las pruebas de la GUI)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Pruebas
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v -rs

      - name: Pruebas
        if: runner.os != 'Linux'
        run: python -m pytest -v -rs
