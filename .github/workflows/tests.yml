name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Ruff
        run: |
          pip install ruff==0.17.4
          ruff check --select F,E9 .

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements.lock -r requirements-dev.lock

      - name: Sistema de archivos del runner
        shell: python
        run: |
          import os, platform, tempfile
          print(platform.platform(), "| temp:", tempfile.gettempdir(), "| cwd:", os.getcwd())

      - name: Instalar xvfb (pantalla virtual para la GUI) y minisign (prueba cruzada de firmas)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y minisign

      - name: Pruebas
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v -rs

      - name: Pruebas
        if: runner.os != 'Linux'
        run: python -m pytest -v -rs
